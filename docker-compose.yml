services:
  cockroachdb:
    image: cockroachdb/cockroach:v24.3.8
    container_name: madrasa-cockroachdb
    restart: unless-stopped
    command: start-single-node --insecure --accept-sql-without-tls
    ports:
      - "26257:26257"
      - "8080:8080"
    volumes:
      - madrasa_crdb_data:/cockroach/cockroach-data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health?ready=1"]
      interval: 3s
      timeout: 3s
      retries: 15
      start_period: 10s

  cockroach-init:
    image: cockroachdb/cockroach:v24.3.8
    depends_on:
      cockroachdb:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        cockroach sql --insecure --host=cockroachdb -e "CREATE DATABASE IF NOT EXISTS madrasa;"
    restart: "no"

volumes:
  madrasa_crdb_data:
