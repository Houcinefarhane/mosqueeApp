services:
  postgres:
    image: postgres:16-alpine
    container_name: madrasa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: madrasa
      POSTGRES_PASSWORD: madrasa
      POSTGRES_DB: madrasa
    ports:
      - "5433:5432"
    volumes:
      - madrasa_pg_data:/var/lib/postgresql/data

volumes:
  madrasa_pg_data:
